<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- Вьюпорт для правильного масштаба на смартфонах -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Кидатель помидоров</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: #1a1a1a;
      cursor: crosshair;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      touch-action: manipulation; /* Убирает задержку клика на тачскрине */
    }

    /* Адаптированная панель управления */
    #controls {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.85);
      padding: 10px 14px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      max-width: 500px;
      margin: 0 auto;
    }

    input[type="file"] { display: none; }

    .btn {
      color: white;
      background: #ff4757;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      border: none;
      font-size: 13px;
      transition: background 0.2s;
      user-select: none;
    }

    .btn:hover { background: #ff6b81; }
    .btn-clear { background: #57606f; }
    .btn-clear:hover { background: #747d8c; }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }

    input[type="range"] {
      cursor: pointer;
      accent-color: #ff4757;
      width: 200px;
    }

    /* Мишень */
    #target-img {
      max-width: 95vw;
      max-height: 80vh;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    /* Помидоры */
    .tomato {
      position: absolute;
      transform: translate(-50%, -45%); /* Твоё проверенное смещение 5% */
      pointer-events: none;
      user-select: none;
      width: auto;
    }
  </style>
</head>
<body>

  <div id="controls">
    <label for="file-input" class="btn">Выбрать мишень</label>
    <input type="file" id="file-input" accept="image/*">
    
    <div class="slider-group">
      <label for="size-slider">Размер:</label>
      <input type="range" id="size-slider" min="30" max="6000" value="200">
      <span id="size-val">200px</span>
    </div>

    <button id="clear-btn" class="btn btn-clear">Смыть</button>
  </div>

  <img id="target-img" alt="Загрузи мишень">

<script>
  const APNG_FILE = 'tomato.png'; 
  const SOUND_FILE = 'splat.mp3'; 

  const fileInput = document.getElementById('file-input');
  const targetImg = document.getElementById('target-img');
  const sizeSlider = document.getElementById('size-slider');
  const sizeVal = document.getElementById('size-val');
  const clearBtn = document.getElementById('clear-btn');

  sizeSlider.addEventListener('input', (e) => {
    sizeVal.textContent = `${e.target.value}px`;
  });

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (evt) => {
        targetImg.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }
  });

  clearBtn.addEventListener('click', () => {
    document.querySelectorAll('.tomato').forEach(el => el.remove());
  });

  // Работает и по тапу на мобилках, и по клику мыши
  window.addEventListener('pointerdown', (e) => {
    // Игнорируем нажатия по меню
    if (e.target.closest('#controls')) return;

    const img = document.createElement('img');
    img.src = `${APNG_FILE}?t=${Date.now()}`;
    img.className = 'tomato';
    
    const currentSize = parseFloat(sizeSlider.value);
    img.style.height = `${currentSize}px`;

    img.style.left = `${e.clientX}px`;
    img.style.top = `${e.clientY}px`;

    if (SOUND_FILE) {
      const audio = new Audio(SOUND_FILE);
      audio.volume = 0.8;
      audio.play().catch(() => {});
    }

    document.body.appendChild(img);
  });
</script>

</body>
</html>
